# One-click deploy on Render (https://render.com). Uploads + DB persist on the attached disk.
services:
  - type: web
    name: adeyemi-visuals
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data/db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SITE_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
