# Oracle Cloud: the app plus a Cloudflare Tunnel. The tunnel makes an outgoing connection to
# Cloudflare, so the server opens no ports and needs no certificate; Cloudflare serves HTTPS.
# It shares the PlayBot VM, so it runs as its own Compose project with its own CPU/memory caps.
#
#   docker compose up -d --build                          # live, via the tunnel in tunnel.env
#   docker compose --profile test up -d --build web quick-tunnel
#                                                         # trial run on a random trycloudflare.com URL
#
# The database stays on Turso and photos on Vercel Blob, so the VM holds no data of its own.
name: yito-shot-it

services:
  web:
    build: ../..
    env_file: ../../.env
    environment:
      NODE_ENV: production
    expose: ["3000"]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "1", memory: 1536M } } }

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file: ./tunnel.env # TUNNEL_TOKEN=eyJ… from Cloudflare Zero Trust
    depends_on: [web]
    restart: unless-stopped
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  # No account needed: prints a https://<random>.trycloudflare.com URL in its logs.
  quick-tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]
    depends_on: [web]
    profiles: [test]
